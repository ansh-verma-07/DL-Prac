<!DOCTYPE html>
<html>
<head><title>House Price</title></head>
<body>
  <h1>House Price Prediction</h1>
  <p>Dataset area range: 1650 to 16200. Inputs outside this range are extrapolation.</p>
  <form method="post">
    Area: <input type="number" name="area" min="1" max="1000000" value="5000" required><br><br>
    Bedrooms: <input type="number" name="bedrooms" min="1" max="6" value="3" required><br><br>
    Bathrooms: <input type="number" name="bathrooms" min="1" max="4" value="2" required><br><br>
    <button type="submit">Predict</button>
  </form>
  <h2>{{ result }}</h2>
  <p>Price is in the dataset's original units.</p>
</body>
</html>
